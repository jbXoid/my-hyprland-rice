general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
}

# Lock after 1 minute of inactivity
listener {
  timeout = 60
  on-timeout = ~/.config/hypr/hypridle_scripts/lock.sh
  on-resume = ~/.config/hypr/hypridle_scripts/lock.sh
}


