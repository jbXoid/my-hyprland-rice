general {
  lock_cmd = ~/.config/hypr/hypridle_scripts/lock.sh
  before_sleep_cmd = loginctl lock-session
}

# Lock after 1 minute of inactivity
listener {
    timeout = 60
    on-timeout = ~/.config/hypr/hypridle_scripts/checkAndLock.sh
}

# Blank the screen after 1.5 minute of inactivity
listener {
    timeout = 90
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
