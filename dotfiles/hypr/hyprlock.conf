general {
  hide_cursor = true
  disable_loading_bar = false
}

background {
  monitor =
  path = ~/wallpapers/default.jpg 
  blur_passes = 2
  blur_size = 8
  vibrancy = 0
}

label {
  monitor =
  text = $TIME
  font_family = JetBrains Mono Nerd Font 10
  font_size = 64
  position = 0, 40%
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(0x33,0x33,0x33)
    inner_color = rgb(0x33,0x33,0x33)
    font_color = rgb(0xFF,0xFF,0xFF)
    #fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    
    position = 0, 200
    halign = center
    valign = bottom
}
